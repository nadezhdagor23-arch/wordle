<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Clone</title>
    <style>
        :root {
            --color-correct: #6aaa64;
            --color-present: #c9b458;
            --color-absent: #787c7e;
            --color-border: #d3d6da;
            --color-empty-border: #878a8c;
            --text-dark: #1a1a1b;
            --text-light: #ffffff;
            --bg-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-index: center;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            border-bottom: 1px solid var(--color-border);
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
        }

        #game-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        /* Board Styling */
        #board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 5px;
            padding: 10px;
            width: 350px;
            height: 420px;
            max-width: 100%;
        }

        .board-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
        }

        .tile {
            width: 100%;
            height: 100%;
            border: 2px solid var(--color-border);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            line-height: 2rem;
            font-weight: bold;
            vertical-align: middle;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.25s linear;
        }

        .tile[data-state="tardy"] {
            border-color: var(--color-empty-border);
        }

        /* Animations */
        .tile.pop {
            animation: PopIn 0.1s ease-in-out;
        }

        @keyframes PopIn {
            0% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .tile.flip {
            transform: rotateX(90deg);
        }

        .tile.correct {
            background-color: var(--color-correct);
            border-color: var(--color-correct);
            color: var(--text-light);
        }

        .tile.present {
            background-color: var(--color-present);
            border-color: var(--color-present);
            color: var(--text-light);
        }

        .tile.absent {
            background-color: var(--color-absent);
            border-color: var(--color-absent);
            color: var(--text-light);
        }

        /* Keyboard Styling */
        #keyboard {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            user-select: none;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            width: 100%;
            gap: 6px;
        }

        .key {
            font-weight: bold;
            border: 0;
            padding: 0;
            height: 58px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            background-color: var(--color-border);
            color: var(--text-dark);
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            font-size: 1.25rem;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            transition: background-color 0.3s ease;
        }

        .key.large {
            flex: 1.5;
            font-size: 0.9rem;
        }

        .key.correct { background-color: var(--color-correct); color: var(--text-light); }
        .key.present { background-color: var(--color-present); color: var(--text-light); }
        .key.absent { background-color: var(--color-absent); color: var(--text-light); }

        /* Toast notifications */
        #toast-container {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translate(-50%, 0);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background-color: var(--text-dark);
            color: var(--bg-color);
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            opacity: 1;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 23px 0 rgba(0, 0, 0, 0.2);
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--bg-color);
            padding: 30px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 23px 0 rgba(0, 0, 0, 0.2);
        }

        .modal h2 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        .modal p {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .modal button {
            background-color: var(--color-correct);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal button:hover {
            background-color: #538d4e;
        }

        /* Responsive scaling for shorter screens */
        @media (max-height: 600px) {
            #board {
                height: 300px;
                width: 250px;
            }
            .tile {
                font-size: 1.5rem;
            }
            .key {
                height: 45px;
            }
        }
    </style>
</head>
